[project]
name = "browse-instagram-reels"
version = "0.1.0"
description = "Browse Instagram Reels by keywords for brand research"
requires-python = ">=3.11,<4.0"
dependencies = [
    "browser-use>=0.12.0",
    "playwright>=1.58.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
include = ["."]
typeCheckingMode = "standard"
