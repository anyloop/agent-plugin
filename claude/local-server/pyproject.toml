[project]
name = "adant-local"
version = "0.1.0"
description = "AdAnt plugin local MCP server: doctor, research fan-out, progress panel"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.14,<3"]

[project.scripts]
adant-local = "adant_local.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adant_local"]
